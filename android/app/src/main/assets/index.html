<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><style>
:root { color-scheme: light; --page:#f0f0f0; --surface:#fff; --ink:#171923; --muted:#575b68; --border:#c4c7d0; --button:#354b80; --button-end:#25375f; --button-ink:#fff; }
:root.dark { color-scheme:dark; --page:#000; --surface:#111; --ink:#f1f1f5; --muted:#b9bdc9; --border:#3e424e; --button:#526da6; --button-end:#384f82; --button-ink:#fff; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:16px Arial,sans-serif; }
main { max-width:1200px; margin:auto; padding:12px; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
label { display:block; margin:0; }
input { width:100%; padding:12px; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:8px; }
nav { display:flex; gap:8px; margin:0 0 4px; }
button { font:inherit; min-height:48px; border:1px solid var(--border); border-radius:10px; color:var(--ink); background:var(--surface); padding:10px; cursor:pointer; }
nav button { flex:1; border:1px solid transparent; background:linear-gradient(var(--button),var(--button-end)); color:var(--button-ink); font-size:14px; font-weight:600; line-height:1.3; box-shadow:0 2px 4px #0003; }
nav button:active { transform:translateY(1px); box-shadow:none; }
button:focus-visible, input:focus-visible { outline:2px solid #789ce8; outline-offset:2px; }
button:disabled { opacity:.5; cursor:default; }
#theme { color:var(--ink); width:44px; height:44px; min-height:44px; flex:0 0 44px; padding:0; border-radius:50%; display:grid; place-items:center; }
#theme svg { display:block; width:24px; height:24px; pointer-events:none; }
#source { font-size:13px; color:var(--muted); margin:0 0 4px; }
.layout { display:flex; flex-direction:column; gap:12px; }
#spread { position:relative; width:100%; height:340px; overflow:hidden; margin-top:30px; margin-bottom:26px; }
#spread img { position:absolute; object-fit:contain; cursor:pointer; }
#text { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px; font:15px/1.5 'Courier New',monospace; white-space:pre-wrap; overflow-wrap:anywhere; min-height:150px; }
.cardlink { display:block; text-align:left; width:100%; background:var(--surface); border:0; border-bottom:1px solid var(--border); border-radius:0; font:inherit; padding:10px 0; }
#reading { white-space:pre-wrap; font-size:17px; line-height:1.6; }
dialog { border:1px solid var(--border); border-radius:12px; padding:12px; max-width:95vw; max-height:95vh; background:var(--page); color:var(--ink); }
dialog::backdrop { background:#000b; }
dialog img { display:block; max-height:65vh; max-width:85vw; margin:auto; }
dialog p { max-width:75vw; }
dialog button { width:100%; }
@media(min-width:800px) { #spread { height:650px; } }
</style></head><body><main><header><label for="query">Enter your query:</label><button id="theme" type="button" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M4.93 4.93l1.41 1.41 M17.66 17.66l1.41 1.41 M4.93 19.07l1.41 -1.41 M17.66 6.34l1.41 -1.41" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header><input id="query" type="text"><div class="layout"><div id="spread"></div><nav><button onclick="draw(1)">Draw One Card</button><button onclick="draw(3)">Draw Three Cards</button><button onclick="draw(10)">Draw Celtic Cross</button></nav><div id="source">Shuffle Source: Waiting for draw...</div><section id="text"><div id="meanings"></div><div id="reading"></div></section></div></main><dialog id="detail"><img id="large"><p id="caption"></p><button onclick="document.getElementById('detail').close()">Close</button></dialog><script src="deck.js"></script><script src="prompts.js"></script><script>
const positions=['Present Situation (1)','Influences or Challenges (2)','Distant Past (3)','Recent Past (4)','Best Outcome (5)','Immediate Future (6)','Advice (7)','Environment (8)','Hopes or Fears (9)','Potential Outcome (10)'];
const $=id=>document.getElementById(id);let cards=[],generation=0,query='',reading='',source='',pending=false;
$('query').addEventListener('input',()=>{query=$('query').value});
function draw(n){if(pending)return;query=$('query').value;generation++;pending=true;document.querySelectorAll('nav button').forEach(b=>b.disabled=true);$('source').textContent='Contacting RANDOM.ORG...';document.activeElement.blur();Android.draw(n)}
function drawFailed(){pending=false;document.querySelectorAll('nav button').forEach(b=>b.disabled=false);$('source').textContent='Unable to complete the draw. Please try again.'}
function showDraw(result){cards=result.cards;source=result.source;reading='';render();$('reading').textContent='\nGenerating tarot reading...';let prompt=prompts[String(cards.length)];cards.forEach((index,i)=>{prompt=prompt.replace('__CARD_'+i+'__',()=>deck[index].name)});prompt=prompt.replace("The following question is considered: '__QUERY__'.",()=>query.trim()?"The following question is considered: '"+query.trim()+"'.":'No specific question is provided.');Android.reading(prompt,generation)}
function showReading(result){if(result.id!==generation)return;pending=false;document.querySelectorAll('nav button').forEach(b=>b.disabled=false);reading=result.error?'Reading service unavailable. The drawn cards and meanings are shown above.':'Tarot Reading:\n'+result.text;$('reading').textContent='\n'+reading}
function inspect(i){const c=deck[cards[i]];$('large').src=c.image;$('caption').textContent=(cards.length===10?positions[i]+': ':'')+c.name+' â€” '+c.meaning;$('detail').showModal()}
function render(){
 $('source').textContent='Shuffle Source: '+(source||'Waiting for draw...');$('meanings').replaceChildren();
 cards.forEach((index,i)=>{const c=deck[index],b=document.createElement('button');b.className='cardlink';b.textContent=(cards.length===10?positions[i]:cards.length===1?'Card':'Card '+(i+1))+':\n'+c.name+' - '+c.meaning;b.onclick=()=>inspect(i);$('meanings').append(b)});
 $('reading').textContent=reading?'\n'+reading:'';layout();
}
function layout(){const area=$('spread');area.replaceChildren();const width=area.clientWidth;let height=window.innerWidth>=800?650:Math.max(300,width*1.05);area.style.height=height+'px';
 if(!cards.length){let img=document.createElement('img');img.src='Back.gif';img.style.cssText='height:90%;width:100%;top:5%;left:0';area.append(img);return}
 let cw,ch,points=[];
 if(cards.length===10){cw=Math.min(width/5.2,height/(4.5*1.72));ch=cw*1.72;let cx=width*.34,cy=height/2;points=[[cx,cy],[cx,cy],[cx,cy+ch*1.1],[cx-cw*1.35,cy],[cx,cy-ch*1.1],[cx+cw*1.35,cy]];for(let i=0;i<4;i++)points.push([width*.88,height*.85-i*height*.235]);ch=Math.min(ch,height/4.5);cw=ch/1.72;
 }else{cw=Math.min(width/(cards.length===1?1.6:3.3),height/1.72*.9);ch=cw*1.72;for(let i=0;i<cards.length;i++)points.push([width*(i+.5)/cards.length,height/2])}
 cards.forEach((index,i)=>{let img=document.createElement('img');img.src=deck[index].image;img.alt=deck[index].name;img.style.width=cw+'px';img.style.height=ch+'px';img.style.left=(points[i][0]-cw/2)+'px';img.style.top=(points[i][1]-ch/2)+'px';if(cards.length===10&&i===1)img.style.transform='rotate(-90deg)';img.onclick=()=>inspect(i);area.append(img)})}
function applyTheme(dark) {
 document.documentElement.classList.toggle('dark',dark);
 $('theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
 $('theme').title=dark?'Switch to light mode':'Switch to dark mode';
 if(typeof Android.setTheme==='function') Android.setTheme(dark);
}
function toggleTheme() {
 const dark=!document.documentElement.classList.contains('dark');
 applyTheme(dark);
 try { localStorage.setItem('theme',dark?'dark':'light'); } catch(e) {}
}
try { localStorage.removeItem('cast'); applyTheme(localStorage.getItem('theme')==='dark'); } catch(e) { applyTheme(false); }
render();window.addEventListener('resize',layout);
</script></body></html>
